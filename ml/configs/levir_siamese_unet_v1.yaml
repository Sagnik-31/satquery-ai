# Conservative starting point for the first learned LEVIR-CD baseline.
# These defaults are not claimed to be optimal; tune only on official validation.
training:
  seed: 20261005
  device: auto
  patch_size: 256
  batch_size: 4
  epochs: 20
  num_workers: 0
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  scheduler_t_max: 20
  validation_tile_batch_size: 8
  bce_weight: 0.5
  dice_weight: 0.5
  selection_metric: iou

model:
  input_channels: 3
  base_channels: 24

dataset:
  identifier: LEVIR-CD
  # The source distribution embeds no immutable version string locally; the
  # train/val content fingerprint recorded at runtime identifies the exact copy.
  version: local-official-split-unversioned

sampling:
  # A fixed development choice: request positive-containing crops half the
  # time and preserve negative crops otherwise. Tune only on validation later.
  positive_crop_fraction: 0.5
  negative_crop_attempts: 32

threshold:
  # Fixed avoids an unrecorded threshold search. If validation_iou_search is
  # intentionally enabled later, its candidate list is evaluated on val only.
  policy: fixed
  value: 0.5
  candidates: [0.5]
